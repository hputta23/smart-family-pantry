<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background bg-dot-pattern">
<main class="flex-grow flex items-center justify-center px-container-padding py-stack-lg">
<div class="max-w-md w-full">
<!-- Brand Anchor Section -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center p-4 bg-primary-container rounded-xl mb-4 board-shadow">
<span class="material-symbols-outlined text-white text-4xl" data-icon="pantry" style="font-variation-settings: 'FILL' 1;">grocery</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Smart Family Pantry</h1>
<p class="font-body-md text-on-surface-variant">Your household's digital kitchen board.</p>
</div>
<!-- Login Card (The Board) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 board-shadow space-y-stack-md">
<form class="space-y-stack-md">
<!-- Email Field -->
<div class="space-y-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-white border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-lg px-4 py-3 text-body-md transition-all outline-none" id="email" placeholder="e.g. mom@kitchen.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-white border-2 border-outline-variant focus:border-primary focus:ring-0 rounded-lg px-4 py-3 text-body-md transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Inline Validation Simulation (Subtle Note) -->
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-sm" data-icon="check_circle">check_circle</span>
<span class="font-label-sm text-label-sm">Secure connection active</span>
</div>
<!-- Actions -->
<div class="pt-2 space-y-3">
<button class="w-full bg-primary text-on-primary font-label-bold text-body-md py-4 rounded-lg board-shadow hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-lg" data-icon="login">login</span>
</button>
<button class="w-full bg-surface-container-high text-primary border border-primary font-label-bold text-body-md py-4 rounded-lg hover:bg-primary hover:text-on-primary transition-all active:scale-[0.98]" type="button">
                            Start a Family Account
                        </button>
</div>
</form>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-container-lowest px-4 font-label-sm text-on-surface-variant">OR</span>
</div>
</div>
<!-- Join a Family Section (Code Input) -->
<div class="bg-secondary-container bg-opacity-10 border border-secondary border-dashed rounded-lg p-6 space-y-4">
<div class="text-center">
<h3 class="font-label-bold text-label-bold text-on-secondary-container">Join an existing Family</h3>
<p class="text-label-sm text-on-surface-variant mt-1">Enter the 6-character pantry code</p>
</div>
<div class="flex justify-center gap-2">
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
<div class="flex items-center text-outline-variant">-</div>
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
<input class="w-10 h-12 border-2 border-outline-variant rounded-lg text-center font-headline-md text-primary bg-white focus:border-secondary focus:ring-0 transition-all uppercase" maxlength="1" type="text"/>
</div>
<button class="w-full font-label-bold text-label-bold text-secondary hover:text-on-secondary-container transition-all py-2">
                        Verify Code &amp; Join
                    </button>
</div>
</div>
<!-- Footer Graphic / Contextual Image -->

<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent flex items-end p-6">
<p class="font-label-sm text-on-surface italic">"A place for everything, and everything in its place."</p>
</div>
</div>
<!-- Copyright/Links -->
<footer class="mt-stack-md flex justify-center gap-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Terms of Service</a>
<span class="text-outline-variant">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Help Center</a>
